<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1f1f1f">
    <title>AC Arise</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Questrial&display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <header class="topbar">
      <a class="brand" href="index.html">
        <img src="img/arise.png" alt="ARISE">
        <span class="brand-text"><strong>AC Arise</strong><small>Menús</small></span>
      </a>
      <a class="pill-link" href="index.html">Ver menú</a>
    </header>
    <main>
      <section class="join" aria-labelledby="join-title">
        <img class="logo" src="img/arise.png" alt="ARISE">
        <p class="eyebrow">AC Arise · Menús</p>
        <h1 id="join-title">Gestión del menú</h1>
        <p class="lead">Entra con tu cuenta autorizada para subir o editar el menú.</p>
        <div class="auth-card"><button id="googleBtn" type="button">Continuar con Google</button><button id="microsoftBtn" type="button">Continuar con Microsoft</button></div>
        <p id="loginMsg" class="msg"></p>
        <a class="back-link" href="index.html">Volver al menú</a>
      </section>
    </main>
    <script type="module" src="login.js"></script>
  </body>
</html>
