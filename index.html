<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>AC Arise</title>
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Questrial&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <img src="img/arise.png" alt="ARISE" />
        <span class="brand-text"><strong>AC Arise</strong><small>Cafetería</small></span>
      </a>
      <a class="pill-link" href="login.html">Gestión</a>
    </header>

    <main class="container">
      <div class="hero">
        <div class="hero-top">
          <p class="eyebrow">Menú del día</p>
          <button id="todayBtn" type="button" class="btn-secondary btn-small">Hoy</button>
        </div>
        <h1 id="dateLabel"></h1>
      </div>

      <nav class="week-nav" aria-label="Días de la semana">
        <button id="prevWeek" type="button" class="icon-btn" aria-label="Semana anterior">‹</button>
        <div id="weekDays" class="week-days"></div>
        <button id="nextWeek" type="button" class="icon-btn" aria-label="Semana siguiente">›</button>
      </nav>

      <p id="status" class="status">Cargando menú…</p>

      <section id="menu" hidden>
        <article class="dish-card">
          <span class="label">Plato del día</span>
          <h2 id="plato"></h2>
        </article>
        <div class="extras">
          <article class="extra">
            <span class="label">Postre</span>
            <p id="postre"></p>
          </article>
          <article class="extra">
            <span class="label">Incluye</span>
            <p>Pan</p>
          </article>
          <article class="extra extra--price">
            <span class="label">Precio</span>
            <p id="price"></p>
          </article>
        </div>
      </section>

      <section id="festivo" class="festivo-card" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16" rx="3" />
          <path d="M3 9.5h18M8 2.5v4M16 2.5v4M9.5 13.5l5 5M14.5 13.5l-5 5" />
        </svg>
        <h2>Día festivo</h2>
        <p>Este día es festivo y la universidad no está abierta.</p>
      </section>
    </main>

    <footer class="footer">
      <img src="img/arise.png" alt="" />
      <span>A.R.I.S.E · Advanced Robotics Informatics Science and Engineering</span>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
